# Core 主 CI——结构与 rust-lang/rust 的 ci.yml 同构（模板源 ~/rust），按 Core 裁剪。
# 触发分层（merge_group 暂缺：merge_queue 因免费计划降级不可用，且 merge_group 事件
# 的工作流只能在默认分支注册——待计划升级后恢复 merge_group + suite/full-bootstrap）：
#   - pull_request（PR 快速层）：check / bootstrap-tests / selfhost-tests
#   - （恢复时）merge_group（完整层）：suite / full-bootstrap
# PR 层 job 在合并时也需通过（Rust 语义：PR CI jobs 自动注册为 auto jobs）。
# job 命令定义在 src/ci/run.sh（case CI_JOB_NAME 分发），本地用 run.sh 可复现。
#
# 2026-08-17 修复：job 级 if 不能引用 matrix 上下文（GitHub 解析器拒绝——
# available: github/inputs/needs/vars），原 `if: matrix.run_type == 'pr'` 导致
# workflow 注册失败（"workflow file issue"，所有 run 0s 失败）——拆分 pr/full 两 job，
# 触发分派改为事件级 if，分发由 CI_JOB_NAME 承担。

name: Core CI
on:
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # PR 快速层：pull_request 事件全矩阵项（3 项）
    # R2 P7 非构建小批（CI 挂点审计 #6）：原 `if: github.event_name == 'pull_request'`
    # 使 `workflow_dispatch` 手动派发**两个 job 全被跳过**（= 派发空转）⇒ 本条纳入
    # workflow_dispatch（手动派发即可跑 PR 层；`||` 右侧为本次改动点）。
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    env:
      CI_JOB_NAME: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: check
          - name: bootstrap-tests
          - name: selfhost-tests
          # opt-regress（O0/O1 自举回归）留位，按 TODO 逐步点亮：
          # - name: opt-regress
    steps:
      - name: checkout the source code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 2

      - name: add extra environment variables
        run: src/ci/scripts/setup-environment.sh

      - name: run the build
        run: src/ci/scripts/run-build-from-ci.sh

  full:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # 完整层（suite / full-bootstrap）：merge_group 事件——当前休眠
    # （免费计划无 merge queue；恢复时在默认分支注册 merge_group 事件）。
    # R2 P7 非构建小批（CI 挂点审计 #6）：原 `if: github.event_name == 'merge_group'`
    # 在休眠期使本层**任何事件都不可达** ⇒ 纳入 workflow_dispatch（手动全量派发即可跑
    # suite / full-bootstrap；`||` 右侧为本次改动点）。若日后需「派发时只跑 PR 层」，
    # 可改为 `workflow_dispatch` 输入开关（本批不做）。
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    env:
      CI_JOB_NAME: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: suite
          - name: full-bootstrap
    steps:
      - name: checkout the source code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 2

      - name: add extra environment variables
        run: src/ci/scripts/setup-environment.sh

      - name: run the build
        run: src/ci/scripts/run-build-from-ci.sh
