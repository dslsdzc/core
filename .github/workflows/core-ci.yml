name: Core CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [develop, main]
  merge_group:
  schedule:
    # Nightly full layer (no full-bootstrap; see workflow_dispatch input).
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: "pr | full | nightly"
        type: choice
        options: [pr, full, nightly]
        default: full
      full_bootstrap:
        description: "Run the three-stage bootstrap (L3)"
        type: boolean
        default: false
      pr:
        description: "PR number: test refs/pull/<n>/merge (merge gate)"
        type: string
        default: ""
      runner:
        description: "Runner label for full-bootstrap (use a larger runner if available)"
        type: string
        default: ubuntu-latest

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI_REF: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.pr != '' && format('refs/pull/{0}/merge', github.event.inputs.pr)) || github.ref }}
  TMPDIR: /tmp

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: echo ok
