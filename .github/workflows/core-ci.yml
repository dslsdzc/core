# Core CI — layered, build-once, changed-area pipeline.
#
# Layers:
#   plan / build            one plan, one compiler build, shared artifact
#   PR gate                 static checks + compiler check + core tests + selected areas
#   full gate               every area + suite + canary (push/merge_group/manual full)
#   L3                      full-bootstrap (manual, optional larger runner)
#
# Required PR check: pr-gate. Required post-submit/manual check: full-gate.
# The full-bootstrap job is intentionally not part of every full run: it is the
# only three-stage self-host build and may need a larger runner.
#
# Local equivalents:
#   python3 src/ci/select_tests.py --profile pr --changed-files <file>
#   python3 src/ci/run_tests.py --area core --profile pr

name: Core CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [develop, main]
  merge_group:
  schedule:
    # Nightly full layer (no full-bootstrap; see workflow_dispatch input).
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: "pr | full | nightly"
        type: choice
        options: [pr, full, nightly]
        default: full
      full_bootstrap:
        description: "Run the three-stage bootstrap (L3)"
        type: boolean
        default: false
      pr:
        description: "PR number: test refs/pull/<n>/merge (merge gate)"
        type: string
        default: ""
      runner:
        description: "Runner label for full-bootstrap (use a larger runner if available)"
        type: string
        default: ubuntu-latest

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI_REF: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.pr != '' && format('refs/pull/{0}/merge', github.event.inputs.pr)) || github.ref }}
  TMPDIR: /tmp

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      profile: ${{ steps.plan.outputs.profile }}
      areas_matrix: ${{ steps.plan.outputs.areas_matrix }}
      full_matrix: ${{ steps.plan.outputs.full_matrix }}
      run_suite: ${{ steps.plan.outputs.run_suite }}
      run_canary: ${{ steps.plan.outputs.run_canary }}
      run_full_bootstrap: ${{ steps.plan.outputs.run_full_bootstrap }}
    steps:
      - name: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.CI_REF }}
          fetch-depth: 0

      - name: environment
        run: src/ci/scripts/setup-environment.sh

      - name: resolve profile and changed files
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          event="$GITHUB_EVENT_NAME"
          profile=""
          case "$event" in
            pull_request) profile=pr ;;
            merge_group|push) profile=full ;;
            schedule) profile=nightly ;;
            workflow_dispatch)
              profile="${{ github.event.inputs.profile }}"
              [ -n "$profile" ] || profile=full
              ;;
            *) profile=full ;;
          esac
          case "$profile" in
            pr|full|nightly) ;;
            *) echo "::error::invalid profile: $profile"; exit 1 ;;
          esac

          changed="$RUNNER_TEMP/changed-files.txt"
          : > "$changed"
          if [ "$event" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            if ! git diff --name-only "$base"...HEAD > "$changed"; then
              git ls-files > "$changed"
            fi
          elif [ "$event" = "push" ]; then
            before="${{ github.event.before }}"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
              if ! git diff --name-only "$before"...HEAD > "$changed"; then
                git ls-files > "$changed"
              fi
            else
              git ls-files > "$changed"
            fi
          elif [ "$event" = "merge_group" ]; then
            base="${{ github.event.merge_group.base_sha }}"
            if ! git diff --name-only "$base"...HEAD > "$changed"; then
              git ls-files > "$changed"
            fi
          else
            # Full/nightly dispatch: the selector ignores the file list, but a
            # complete list keeps the plan summary honest.
            git ls-files > "$changed"
          fi

          args=(--profile "$profile" --changed-files "$changed" --github-output "$GITHUB_OUTPUT")
          if [ "${{ github.event.inputs.full_bootstrap }}" = "true" ]; then
            args+=(--full-bootstrap)
          fi
          python3 src/ci/select_tests.py "${args[@]}"

          {
            echo "### CI plan"
            echo "- profile: $profile"
            echo "- changed files: $(wc -l < "$changed")"
            python3 src/ci/select_tests.py --profile "$profile" --changed-files "$changed" | sed 's/^/  /'
          } >> "$GITHUB_STEP_SUMMARY"

