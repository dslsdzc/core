# CI area manifest.
#
# Order matters: a command belongs to the first area whose `match` regex hits,
# and a changed path belongs to every area whose `paths` prefix hits (minus
# `exclude`). `core` is always selected for pull requests.
#
# `match` values are Python regular expressions searched against the command
# line from src/ci/selfhost_tests.list. Keep the list as the single command
# source; this file only classifies it.

[core]
always = true
paths = []
match = [
  "test_compile\\.py",
  "test_type_engine\\.py",
  "test_purity\\.py",
  "test_ccr_types\\.py",
  "test_merge_copy\\.py",
  "test_region_escape\\.py",
  "test_graph_compose\\.py",
  "test_generic_constraints\\.py",
  "test_generic_modules\\.py",
]

