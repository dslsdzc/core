# === core-x86.toml ===
# 硬件接口表（HIT）：x86-64 平台投影表——最小核（M1）第一份表。
# 格式定稿：docs/superpowers/plans/2026-09-05-hit-minimal-core-m1.md「表文件格式」节。
# 设计依据：docs/superpowers/specs/2026-09-05-hardware-interface-table.md。
# 契约：表 = corearch 运行的唯一平台依赖（M1：实现事件 1-4 即可运行）。
#
# 事件记录字段（每事件 32B，见 hit.cr 加载器）：
#   id          最小核事件号（sub=1 nand=2 load=3 store=4）
#   name        事件名（语义锚，供诊断/调试）
#   arith       语义锚：规约层引用（M1 不消费）
#   inputs/outputs      事件签名（无宽度/寄存器/寻址——最小核抽象）
#   side_effect "pure"/"effect"——内存效应标记
# [[event.proj]] 投影条目（每事件一个或多个；M1 每事件恰一个单步投影）：
#   opcode            指令字节序列（M1 ≤2 字节 = 前缀+opcode；行内数值即真源——
#                     sub = [0x4D,0x29]（REX.W+R+B：r10/r11 对需 R/B 位），非草案 0x48）
#   modrm_reg_role    modrm.reg 字段操作数角色（dst/src1/src2/addr/val）
#   modrm_rm_role     modrm.rm  字段操作数角色
#   rm_mode           0 = rm 为寄存器（地址先加载进寄存器）；1 = rm 为 rbp+disp32（槽/常量池寻址）
# 解析规则见 hit.cr；模板解释/发射见计划 Task 2。

[table]
name = "core-x86-min"
events = 4            # 最小核契约：实现 1-4 即可运行

[[event]]
id = 1                # sub
name = "sub"
arith = "sub"         # 语义锚：规约层引用（M1 不消费）
inputs = 2
outputs = 1
side_effect = "pure"

[[event.proj]]        # x86 投影：sub r/m64, r64 = r/m ← r/m − r
isa = "x86-64"
# M1 模板解释器寄存器惯例（rm_mode=0，与 instr.cr e2_alu 逐字节同——旧路径为真值）：
#   第一输入 src1 → r10（累加/结果寄存器）；第二输入 src2 → r11（reg 字段位）
#   旧路径发射 = 4D 29 DA（REX.W+R+B：r10/r11 寄存器对需 R/B 扩展位）
opcode = [0x4D, 0x29]        # REX.W+R+B + sub r/m64,r64
modrm_reg_role = "src2"      # reg 字段 = 第二输入（被减数，驻 r11）
modrm_rm_role = "dst"        # rm 字段 = 目标/结果寄存器（r10，运算前驻第一输入）
rm_mode = 0                  # 0 = rm 为寄存器（加载到 r10）；1 = rm 为 rbp+disp32（槽/常量池寻址）

[[event]]
id = 2
name = "nand"
inputs = 2
outputs = 1
side_effect = "pure"

[[event.proj]]
isa = "x86-64"
# M1 占位：x86 无 nand 指令——单步 and（and r/m64,r64 = 4D 21 DA：r10 ← r10 & r11，
# 同 sub 的 r10/r11 双寄存器形态）。投影到语义 nand 的完整序列（and+not 两步）
# + 事件流语义闭合 = M2
opcode = [0x4D, 0x21]        # REX.W+R+B + and r/m64,r64
modrm_reg_role = "src2"
modrm_rm_role = "dst"
rm_mode = 0

[[event]]
id = 3
name = "load"
inputs = 1            # 地址
outputs = 1
side_effect = "effect"

[[event.proj]]
isa = "x86-64"
# rm_mode=1：rm = rbp+disp32（槽/常量池寻址，mod=2 rm=5；disp = 地址角色变量的槽偏移）。
# reg 字段寄存器 = dst（M1 惯例 r10 → REX.W+R = 0x4C）。disp8 短形 = M2 形态扩展。
opcode = [0x4C, 0x8B]        # REX.W+R + mov r64, r/m64（读：dst ← [rbp+disp32]）
modrm_reg_role = "dst"
modrm_rm_role = "addr"
rm_mode = 1

[[event]]
id = 4
name = "store"
inputs = 2            # 地址, 值
outputs = 0
side_effect = "effect"

[[event.proj]]
isa = "x86-64"
# rm_mode=1：rm = rbp+disp32（槽寻址）。reg 字段寄存器 = val（M1 惯例 r10 → 0x4C）。
opcode = [0x4C, 0x89]        # REX.W+R + mov r/m64, r64（写：[rbp+disp32] ← val）
modrm_reg_role = "val"
modrm_rm_role = "addr"
rm_mode = 1
